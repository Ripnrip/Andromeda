name: CI

on:
  # Feature-branch pushes are validated via pull_request; push runs only on
  # the default branch (prevents merge-triggered reruns clogging the queue).
  # workflow_dispatch is the manual lane for webhook-lost pushes.
  pull_request:
  workflow_dispatch:
  # Only run on push for the default branch (main) to catch direct merges.
  # Feature-branch pushes are validated via the pull_request trigger above;
  # this prevents merge-triggered CI reruns from clogging the queue.
  push:
    branches:
      - main

# Cancel superseded runs for the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS)
    # macOS runner is required: the snapshot suite is AppKit-guarded and would be
    # silently skipped on Linux, hiding red snapshots.
    # Snapshot PNGs are tied to this image (re-record with [record-snapshots] if changed).
    # ADR-0018: macos-26 matches the fleet's OS generation, collapsing the
    # runner-image-bound baseline drift (the 30 local snapshot failures).
    # Qdrant is reached through the ephemeral Tailscale node below; Studio remains
    # a secondary self-hosted fallback runner.
    runs-on: macos-26
    steps:
      - name: Checkout
        # Pin to immutable SHA (v4.3.1); mutable @v4 tags are a supply-chain risk.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # pull_request checkouts are merge commits; depth 2 is enough to diff
          # against the first parent and cheaply scope CI without a full-history fetch.
          fetch-depth: 2

      # Scope classification lives in Swift (AGENTS.md: no project-maintained
      # shell automation). A/B-verified identical to the retired bash script.
      #
      # TRUST BOUNDARY (Manus / Cursor Security): on pull_request, compile the
      # base parent's CIScope (HEAD^1 on the merge commit) — never the PR's own
      # rewrite. Self-classification in that trusted binary arms every lane when
      # Tools/CIScope/ is in the diff; a neutered PR binary cannot delete the
      # rule from the classifier that actually runs. Bootstrap: if base has no
      # CIScope yet, fall back to the PR copy (first-land only).
      - name: Determine CI scope (Swift)
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="Tools/CIScope/CIScope.swift"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git cat-file -e "HEAD^1:Tools/CIScope/CIScope.swift" 2>/dev/null; then
              git show "HEAD^1:Tools/CIScope/CIScope.swift" > /tmp/CIScope-trusted.swift
              SOURCE=/tmp/CIScope-trusted.swift
              echo "🔒 compiling trusted CIScope from HEAD^1 (base parent)"
            else
              echo "⚠️ base has no CIScope yet — compiling PR copy (bootstrap)"
            fi
          fi
          swiftc "$SOURCE" -o /tmp/ciscope
          /tmp/ciscope --event "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: No build/test lanes matched this diff
        if: steps.scope.outputs.any_lane != 'true'
        run: echo "Docs/config-only diff — skipping Swift build/test lanes."

      # Canon lint (swift-canon enforcement): ast-grep rules in canon/ast-grep/.
      # Warning-level findings exit 0 (advisory) until the existing sites are
      # cleaned (HAB-316/317), then severity flips to error and this gates.
      # Rule-file parse errors also fail — broken rules never pass silently.
      - name: Canon lint (ast-grep)
        if: steps.scope.outputs.any_lane == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install ast-grep
          sg scan

      - name: Select Xcode 26.6 (Swift 6.1+)
        if: steps.scope.outputs.any_lane == 'true'
        # Package.swift requires swift-tools-version 6.1; pin Xcode so the toolchain
        # does not drift when the hosted runner default changes. ADR-0018: macos-26
        # image ships Xcode 26.6 as default — same major as the fleet.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Swift version
        if: steps.scope.outputs.any_lane == 'true'
        run: swift --version

      - name: Cache SwiftPM shared dependency artifacts
        if: steps.scope.outputs.any_lane == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-shared-${{ runner.os }}-xcode-26-6-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/MemoryKit/Package.swift', 'Packages/MemoryKit/Package.resolved', 'Packages/Anima/Package.swift', 'Packages/Anima/Package.resolved') }}
          restore-keys: |
            swiftpm-shared-${{ runner.os }}-xcode-26-6-

      - name: Cache Swift build artifacts
        if: steps.scope.outputs.any_lane == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            Packages/MemoryKit/.build
            Packages/Anima/.build
          # Key on manifests/lockfiles only so identical dependency graphs can reuse
          # incremental build products across reruns and nearby PRs.
          key: swiftpm-builds-${{ runner.os }}-xcode-26-6-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/MemoryKit/Package.swift', 'Packages/MemoryKit/Package.resolved', 'Packages/Anima/Package.swift', 'Packages/Anima/Package.resolved') }}
          restore-keys: |
            swiftpm-builds-${{ runner.os }}-xcode-26-6-

      # Fork PRs do not receive repository secrets (Codex P2 / BIN-218). Gate live
      # Qdrant so ordinary build+unit tests still run without TS_AUTHKEY.
      - name: Detect live Qdrant availability
        if: steps.scope.outputs.needs_qdrant == 'true'
        id: qdrant
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -n "$TS_AUTHKEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "url=http://100.89.167.39:8447" >> "$GITHUB_OUTPUT"
            echo "Live Qdrant enabled (TS_AUTHKEY present)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "TS_AUTHKEY absent — skipping Tailscale/live Qdrant; unit tests still run"
          fi

      - name: Connect to Studio tailnet
        if: steps.scope.outputs.needs_qdrant == 'true' && steps.qdrant.outputs.enabled == 'true'
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify Studio Qdrant
        if: steps.scope.outputs.needs_qdrant == 'true' && steps.qdrant.outputs.enabled == 'true'
        id: qdrant_verify
        env:
          ANDROMEDA_TEST_QDRANT_URL: ${{ steps.qdrant.outputs.url }}
        run: |
          set +e
          tailscale status
          tailscale ping --c 3 studio || true
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-delay 2 \
            "$ANDROMEDA_TEST_QDRANT_URL/collections" >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Studio Qdrant reachable over tailnet"
          else
            # Tailscale up ≠ Qdrant listening. Fail open so unit tests still run
            # (same posture as TS_AUTHKEY-absent forks).
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "::warning::Studio Qdrant unreachable (curl exit $status); continuing without live Qdrant"
          fi

      - name: Build
        if: steps.scope.outputs.run_root == 'true'
        run: swift build

      # Baselines must be recorded on macos-26 + Xcode 26.6 (this job; ADR-0018). Other
      # OS/Xcode combinations will not pixel-match the runner. Tip a commit with [record-snapshots]
      # to rewrite **/__Snapshots__ here, then download the artifact and commit.
      # pull_request checkouts are merge commits whose message often mirrors the PR title —
      # only the PR head tip commit message may enable record mode.
      - name: Detect snapshot record mode
        if: steps.scope.outputs.any_lane == 'true'
        id: snapshots
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_HEAD_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
            MSG="$(git log -1 --pretty=%s "$PR_HEAD_SHA")"
          else
            MSG="$(git log -1 --pretty=%s)"
          fi
          if printf '%s' "$MSG" | grep -q '\[record-snapshots\]'; then
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "SNAPSHOT_TESTING_RECORD enabled for this commit"
          else
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi

      # SwiftLint + SwiftFormat — the Orchestrator package is under lint
      # first (see .swiftlint.yml `included`); widen per package as they're
      # brought in. Zero serious violations required. Runs BEFORE the test
      # lanes (fast gate) and with `always()` semantics of its own flag —
      # a custom `if` without a status check is implicitly ANDed with
      # success(), so a failed test step would silently skip lint otherwise.
      - name: Lint (swiftlint + swiftformat)
        if: ${{ always() && steps.scope.outputs.run_orchestrator == 'true' }}
        run: |
          brew install swiftlint swiftformat
          # Gate: zero SERIOUS violations (errors). Warnings are visible debt.
          swiftlint
          swiftformat --lint Packages/AndromedaOrchestrator

      - name: Test (root package)
        if: steps.scope.outputs.run_root == 'true' && steps.snapshots.outputs.record != 'true'
        env:
          ANDROMEDA_TEST_QDRANT_URL: ${{ steps.qdrant_verify.outputs.reachable == 'true' && steps.qdrant.outputs.url || '' }}
        # Single worker: AppKit snapshot + MainActor HUD tests contend under default
        # Swift Testing parallelism and flake debounce / project.state timeouts on CI.
        # IMPORTANT: do not set SNAPSHOT_TESTING_RECORD="" — empty still counts as set
        # in ProcessInfo.environment and forces Point-Free record=.all (always fails).
        # When url is empty, live Qdrant tests fall back to localhost and skip if down.
        shell: bash
        run: |
          set -euo pipefail
          args=(--parallel --num-workers 1 --skip HUDRecallE2ESnapshotTests --skip ProjectionEndToEndTests --skip QdrantProjectionTests)
          swift test "${args[@]}"

      - name: Test (root package, record snapshots)
        if: steps.scope.outputs.run_root == 'true' && steps.snapshots.outputs.record == 'true'
        env:
          SNAPSHOT_TESTING_RECORD: "1"
          ANDROMEDA_TEST_QDRANT_URL: ${{ steps.qdrant_verify.outputs.reachable == 'true' && steps.qdrant.outputs.url || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--parallel --num-workers 1)
          if [ "${{ steps.scope.outputs.run_root_e2e }}" != 'true' ]; then
            args+=(--skip HUDRecallE2ESnapshotTests --skip ProjectionEndToEndTests --skip QdrantProjectionTests)
          fi
          swift test "${args[@]}"
        continue-on-error: true

      # Nested SPM package — root `swift test` does not discover MemoryKitTests.
      - name: Test MemoryKit (nested package)
        if: steps.scope.outputs.run_memorykit == 'true' && steps.snapshots.outputs.record != 'true'
        working-directory: Packages/MemoryKit
        shell: bash
        run: |
          set -euo pipefail
          args=(--parallel --num-workers 1 --skip RetrievalServiceVaultLiveTests)
          swift test "${args[@]}"

      - name: Test MemoryKit (nested package, record snapshots)
        if: steps.scope.outputs.run_memorykit == 'true' && steps.snapshots.outputs.record == 'true'
        working-directory: Packages/MemoryKit
        env:
          SNAPSHOT_TESTING_RECORD: "1"
        shell: bash
        run: |
          set -euo pipefail
          args=(--parallel --num-workers 1)
          if [ "${{ steps.scope.outputs.run_memorykit_live_e2e }}" != 'true' ]; then
            args+=(--skip RetrievalServiceVaultLiveTests)
          fi
          swift test "${args[@]}"
        continue-on-error: true

      - name: Test Anima (nested package, Phase 1)
        if: steps.scope.outputs.run_anima == 'true' && steps.snapshots.outputs.record != 'true'
        working-directory: Packages/Anima
        # Purge stale .build first: shared checkouts may carry modules compiled
        # by a different Swift than the Xcode-select pin (e.g. 6.1.2 artifacts
        # under the 6.3.3 compiler after the ADR-0018 toolchain bump).
        run: |
          rm -rf .build
          swift test --parallel --num-workers 1

      # Nested MCP server package. The protocol tests drive the built binary
      # end-to-end and need the ast-grep engine on PATH, which GitHub runners
      # do not preinstall. Skip path intentionally unavailable: an MCP diff
      # that skips its own tests is fake-green.
      - name: Test AndromedaMCP (nested package)
        if: steps.scope.outputs.run_andromeda_mcp == 'true'
        working-directory: Packages/AndromedaMCP
        shell: bash
        run: |
          set -euo pipefail
          brew install ast-grep
          swift test --parallel --num-workers 1

      # Nested PowerKit package (leases + power assertions). Same anti-greenwash
      # posture as the MCP lane: a PowerKit diff must run PowerKit tests.
      - name: Test AndromedaPowerKit (nested package)
        if: steps.scope.outputs.run_powerkit == 'true'
        working-directory: Packages/AndromedaPowerKit
        run: swift test --parallel --num-workers 1

      # Nested Statusline package.
      - name: Test AndromedaStatusline (nested package)
        if: steps.scope.outputs.run_statusline == 'true'
        working-directory: Packages/AndromedaStatusline
        run: swift test --parallel --num-workers 1

      # Nested SwiftUI design-system package (BIN-270 Gate 0). Scope-gated like the
      # other nested lanes: without the lane flag, snapshot-record tips dead-end at
      # "No build/test lanes matched" and the record run never happens.
      - name: Test AndromedaUI (nested package)
        if: steps.scope.outputs.run_andromeda_ui == 'true' && steps.snapshots.outputs.record != 'true'
        working-directory: Packages/AndromedaUI
        run: swift test --parallel --num-workers 1

      - name: Test AndromedaUI (nested package, record snapshots)
        if: steps.scope.outputs.run_andromeda_ui == 'true' && steps.snapshots.outputs.record == 'true'
        working-directory: Packages/AndromedaUI
        env:
          SNAPSHOT_TESTING_RECORD: "1"
        run: swift test --parallel --num-workers 1
        continue-on-error: true

      # Nested process-guardian package. Policy/coordinator tests use fixture
      # providers and recording mocks — no live processes, no snapshots.
      - name: Test AndromedaGuardian (nested package)
        if: steps.scope.outputs.run_guardian == 'true'
        working-directory: Packages/AndromedaGuardian
        run: swift test --parallel --num-workers 1

      # Nested SwiftUI orchestrator-console package. Same Gate-0 shape as
      # AndromedaUI: preview-parity + catalogue sweep baselines are
      # runner-image-bound; record tips rewrite them via the artifact upload.
      - name: Test AndromedaOrchestrator (nested package)
        if: steps.scope.outputs.run_orchestrator == 'true' && steps.snapshots.outputs.record != 'true'
        working-directory: Packages/AndromedaOrchestrator
        run: swift test --parallel --num-workers 1

      # Compile gate BEFORE the tolerant record step. Record mode fails the
      # test run on purpose (continue-on-error below), which also swallows
      # COMPILE failures — and the artifact then re-uploads the previously
      # committed baselines unchanged, masquerading as fresh runner output.
      # This strict build makes that failure mode loud instead of silent.
      # (Provenance rule: byte-diff the artifact against HEAD before landing.)
      - name: Record gate · AndromedaOrchestrator compiles
        if: steps.scope.outputs.run_orchestrator == 'true' && steps.snapshots.outputs.record == 'true'
        working-directory: Packages/AndromedaOrchestrator
        run: swift build --build-tests

      - name: Test AndromedaOrchestrator (nested package, record snapshots)
        if: steps.scope.outputs.run_orchestrator == 'true' && steps.snapshots.outputs.record == 'true'
        working-directory: Packages/AndromedaOrchestrator
        env:
          SNAPSHOT_TESTING_RECORD: "1"
        run: swift test --parallel --num-workers 1
        continue-on-error: true

      - name: Upload CI snapshot baselines
        # SnapshotTesting .all records PNGs then fails on purpose ("Record mode is on").
        # Always upload after a record tip so we can commit the rewritten baselines.
        if: ${{ always() && steps.scope.outputs.any_lane == 'true' && steps.snapshots.outputs.record == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-snapshot-baselines-${{ github.sha }}
          path: |
            Tests/AndromedaHUDTests/__Snapshots__/
            Tests/AndromedaHomeTests/__Snapshots__/
            Packages/MemoryKit/Tests/MemoryKitTests/__Snapshots__/
            Packages/MemoryKit/Tests/MemoryKitTests/Snapshots/__Snapshots__/
            Packages/AndromedaUI/Tests/AndromedaUITests/__Snapshots__/
            Packages/AndromedaOrchestrator/Tests/AndromedaOrchestratorTests/__Snapshots__/
          if-no-files-found: error

      # Explicit e2e gate (also covered by MemoryKit suite). Skips cleanly when
      # ~/Developer/SecondBrain or /opt/homebrew/bin/rg are absent on the runner.
      - name: E2E · live-vault recall (RetrievalServiceVaultLiveTests)
        if: steps.scope.outputs.run_memorykit_live_e2e == 'true' && steps.snapshots.outputs.record != 'true'
        working-directory: Packages/MemoryKit
        run: swift test --filter RetrievalServiceVaultLiveTests --parallel --num-workers 1

      # Full-pipeline root-package e2e suites are carved out of the main test pass so
      # ordinary UI and package changes do not always pay the E2E cost.
      - name: E2E · projection pipeline
        if: steps.scope.outputs.run_root_e2e == 'true' && steps.snapshots.outputs.record != 'true'
        env:
          ANDROMEDA_TEST_QDRANT_URL: ${{ steps.qdrant_verify.outputs.reachable == 'true' && steps.qdrant.outputs.url || '' }}
        run: |
          swift test --filter ProjectionEndToEndTests --parallel --num-workers 1
          swift test --filter QdrantProjectionTests --parallel --num-workers 1

      # Full-pipeline HUD e2e (store → recall → render). Only present once
      # AndromedaHUDTests is wired in Package.swift (HUD promote PR).
      - name: E2E · HUD store→recall→render snapshots
        if: steps.scope.outputs.run_root_e2e == 'true' && steps.snapshots.outputs.record != 'true'
        env:
          ANDROMEDA_TEST_QDRANT_URL: ${{ steps.qdrant_verify.outputs.reachable == 'true' && steps.qdrant.outputs.url || '' }}
        run: |
          if swift package dump-package 2>/dev/null | grep -q '"AndromedaHUDTests"'; then
            swift test --filter HUDRecallE2ESnapshotTests --parallel --num-workers 1
          else
            echo "AndromedaHUDTests not in Package.swift yet — skipping HUD e2e (lands with HUD promote)"
          fi
