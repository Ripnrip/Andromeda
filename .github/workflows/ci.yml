name: CI

on:
  push:
  pull_request:

# Cancel superseded runs for the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS)
    # macOS runner is required: the snapshot suite is AppKit-guarded and would be
    # silently skipped on Linux, hiding red snapshots.
    runs-on: macos-15
    steps:
      - name: Checkout
        # Pin to immutable SHA (v4.3.1); mutable @v4 tags are a supply-chain risk.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode 16.4 (Swift 6.1)
        # Package.swift requires swift-tools-version 6.1; pin Xcode so the toolchain
        # does not drift when the runner default changes.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test (root package)
        run: swift test

      # Nested SPM package — root `swift test` does not discover MemoryKitTests.
      - name: Test MemoryKit (nested package)
        working-directory: Packages/MemoryKit
        run: swift test

      # Explicit e2e gate (also covered by MemoryKit suite). Skips cleanly when
      # ~/Developer/SecondBrain or /opt/homebrew/bin/rg are absent on the runner.
      - name: E2E · live-vault recall (RetrievalServiceVaultLiveTests)
        working-directory: Packages/MemoryKit
        run: swift test --filter RetrievalServiceVaultLiveTests

      # Full-pipeline HUD e2e (store → recall → render). Only present once
      # AndromedaHUDTests is wired in Package.swift (HUD promote PR).
      - name: E2E · HUD store→recall→render snapshots
        run: |
          if swift package dump-package 2>/dev/null | grep -q '"AndromedaHUDTests"'; then
            swift test --filter HUDRecallE2ESnapshotTests
          else
            echo "AndromedaHUDTests not in Package.swift yet — skipping HUD e2e (lands with HUD promote)"
          fi
