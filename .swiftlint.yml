# SwiftLint — Andromeda fleet config (adopted 2026-08-27, PR fast-follow to #61)
#
# Incremental adoption: the Orchestrator package is lint-clean first; widen
# `included` per package as they're brought under lint in their own PRs.
# This file is the single fleet source — nested packages may add stricter
# local overrides, never looser ones.

# Canon enforcement (HAB-1069): the custom rule below hard-errors on stringly
# wire fields (andromeda-swift-canon: rich enums for external type fields).
# `included:` widens per package as each is brought lint-clean — when the
# App Control package lands, add it here BEFORE merge; the repo-wide backstop
# is CanonPolicyTests (Tests/RepositoryPolicyTests), which scans everything
# and carries the grandfathered debt inventory.
included:
  - Packages/AndromedaOrchestrator

excluded:
  - "**/.build"
  - "**/__Snapshots__"

opt_in_rules:
  - collection_alignment
  - empty_count
  - fatal_error_message
  - first_where
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_nimble
  - prohibited_super
  - reduce_into
  - redundant_nil_coalescing
  - single_test_class
  - sorted_first_last
  - static_operator
  - unowned_preference
  - unused_declaration
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - trailing_comma
  - switch_case_on_newline

# Tool-contract: SwiftFormat owns formatting (it adds trailing commas — legal
# Swift, canonical for this fleet); SwiftLint owns semantics. Style rules that
# fight the formatter are disabled here, not toggled per-PR.

line_length:
  warning: 140
  error: 200

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - x
    - y
    - at
    - to
    - of

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

# Canon alignment: enums switch, no string building at call sites, explicit
# types at boundaries — the default rule set already pushes this direction.

# HAB-1069 — stringly wire fields are canon violations (andromeda-swift-canon:
# rich enums for external type fields). Fires only inside `included:` packages;
# the repo-wide backstop with the grandfathered debt inventory is CanonPolicyTests.
custom_rules:
  stringly_typed_wire_field:
    name: "Stringly-typed Wire Field"
    regex: '(?m)public\s+(let|var)\s+(kind|status|type|action|severity|state)\s*:\s*String\b'
    message: "Wire-contract fields must be rich enums (andromeda-swift-canon) with unknown-value decoding, not bare String. Pre-existing debt: CanonPolicyTests.stringlyFieldDebt."
    severity: error
